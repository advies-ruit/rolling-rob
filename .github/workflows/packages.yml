# The desktop program, packaged for players: a Linux AppImage (x86-64,
# arm64 for a Raspberry Pi with 64-bit Raspberry Pi OS, and armhf for one
# with 32-bit Raspberry Pi OS; glibc 2.31 or newer) and the same as a
# tar.gz (for a device without FUSE), a Windows x64 zip and a
# universal macOS app. Each package is started on its own system and
# the bot has to finish all levels with it, from another folder (so the
# art and music inside the package are what it uses).
# Called by ci.yml (every push and pull request: built and tested only)
# and pages.yml (a tag: the packages go into the release).
name: Packages

on:
  workflow_call:
    inputs:
      version:
        description: 'The release tag the packages carry (empty: git describe)'
        type: string
        default: ''

permissions:
  contents: read

env:
  SDL2_VERSION: 2.32.10
  # the bot run every package makes; check.sh then wants all levels finished
  # and the painted art loaded from the package
  BOT: --headless --bot --seed 6 --frames 300000 --out bot.raw

jobs:
  linux:
    # Built and tested in Debian 11 ("bullseye", glibc 2.31) of each target
    # (tools/build-linux.sh): the AppImage then runs on Debian 11+, Ubuntu
    # 20.04+ and Raspberry Pi OS 11 ("Bullseye") and newer. tools/check-glibc.sh
    # makes sure no file in it needs a newer glibc, and the bot run happens
    # in Debian 11 too. armhf (32-bit ARM, ARMv7: Raspberry Pi 2, 3, 4, 5 and
    # Zero 2 with 32-bit Raspberry Pi OS) has no GitHub runner -- its ARM CPUs
    # run no 32-bit code -- so it is cross-compiled in an x86-64 Debian 11
    # with Debian 11's own armhf compiler and libraries (cross: armhf, a few
    # minutes; built in an emulated armhf container it took half an hour),
    # and its bot run is emulated (QEMU).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            tool: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tool: aarch64
          - arch: armhf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            build-platform: linux/amd64
            cross: armhf
            tool: x86_64
            emulated: true
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: debian:bullseye
      GLIBC_MAX: '2.31'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulated
        with:
          platforms: arm
      - name: Build (Debian 11, ${{ matrix.cross && format('cross-compiled for {0}', matrix.cross) || matrix.platform }})
        run: |
          docker run --rm --platform ${{ matrix.build-platform || matrix.platform }} -v "$PWD:/src" -w /src \
            -e SDL2_VERSION -e RR_VERSION="${{ inputs.version }}" -e CROSS="${{ matrix.cross }}" \
            $IMAGE sh tools/build-linux.sh build-linux
      - name: Package
        run: |
          base=https://github.com/AppImage
          curl -sSfL -o appimagetool $base/appimagetool/releases/download/continuous/appimagetool-${{ matrix.tool }}.AppImage
          curl -sSfL -o runtime $base/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}
          chmod +x appimagetool
          sudo chown -R "$(id -u)" build-linux
          tools/package-linux.sh build-linux out ${{ matrix.arch }}
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          RUNTIME: ${{ github.workspace }}/runtime
      - name: glibc needed, and a bot run with the AppImage (Debian 11)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src -e BOT -e GLIBC_MAX \
            -e EMULATED="${{ matrix.emulated && '1' || '' }}" $IMAGE bash -euc '
            sh tools/debian-apt.sh binutils squashfs-tools
            sh tools/check-glibc.sh build-linux/AppDir "$GLIBC_MAX"
            mkdir -p elsewhere && cd elsewhere
            app=../out/Rolling-Rob-Linux-${{ matrix.arch }}.AppImage
            if [ -n "$EMULATED" ]; then
              # QEMU (binfmt) does not take an AppImage for an ARM program -- its ELF
              # header carries the AppImage magic -- so unpack it as its runtime
              # would, and start AppRun: on a real Pi the CPU runs it directly
              unsquashfs -q -d unpacked -o "$(sh ../tools/appimage-offset.sh "$app")" "$app"
              ./unpacked/AppRun $BOT 2>&1 | tee bot.txt
            else
              "$app" --appimage-extract-and-run $BOT 2>&1 | tee bot.txt
            fi
            sh ../tools/check-bot-run.sh bot.txt
            # the tar.gz, unpacked: started from here (no art/), its program
            # finds its own
            mkdir ../tarred
            tar -xzf ../out/Rolling-Rob-Linux-${{ matrix.arch }}.tar.gz -C ../tarred
            ../tarred/Rolling-Rob/rolling-rob --headless --frames 120 --out tar.raw 2>&1 | tee tar.txt
            grep -q "art: level 0 landscape" tar.txt'
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            out/Rolling-Rob-Linux-${{ matrix.arch }}.AppImage
            out/Rolling-Rob-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    # cross-compiled with mingw-w64, SDL2 linked in: one exe, nothing to install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 zip
          curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-mingw.tar.gz | tar -xz
      - name: Build
        run: |
          cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake \
                -DCMAKE_PREFIX_PATH="$PWD/SDL2-$SDL2_VERSION/x86_64-w64-mingw32" -DROLLING_ROB_SDL2_STATIC=ON \
                -DROLLING_ROB_TESTS=OFF -DROLLING_ROB_WERROR=ON -DROLLING_ROB_VERSION="${{ inputs.version }}"
          cmake --build build-win -j"$(nproc)" --target rolling_rob_sim
      - name: Package
        run: tools/package-windows.sh build-win out
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64
          path: out/Rolling-Rob-Windows-x64.zip
          if-no-files-found: error

  windows-test:
    needs: windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/check-bot-run.sh
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v8
        with:
          name: package-windows-x64
      - name: Bot run with the exe
        run: |
          unzip -q Rolling-Rob-Windows-x64.zip
          mkdir elsewhere && cd elsewhere
          "../Rolling Rob/RollingRob.exe" $BOT > bot.txt 2>&1 || { cat bot.txt; exit 1; }
          cat bot.txt
          sh ../src/tools/check-bot-run.sh bot.txt

  macos:
    # universal (arm64 + x86_64) against a universal static SDL2 built here
    runs-on: macos-15
    env:
      ARCHS: arm64;x86_64
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: SDL2 (universal, static)
        run: |
          curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz | tar -xz
          cmake -S SDL2-$SDL2_VERSION -B sdl-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
                -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl2"
          cmake --build sdl-build -j"$(sysctl -n hw.ncpu)" && cmake --install sdl-build
      - name: Build
        run: |
          cmake -S . -B build-mac -DCMAKE_OSX_ARCHITECTURES="$ARCHS" -DCMAKE_PREFIX_PATH="$PWD/sdl2" \
                -DROLLING_ROB_SDL2_STATIC=ON -DROLLING_ROB_TESTS=OFF -DROLLING_ROB_WERROR=ON \
                -DROLLING_ROB_VERSION="${{ inputs.version }}"
          cmake --build build-mac -j"$(sysctl -n hw.ncpu)" --target rolling_rob_sim
      - name: Package
        run: tools/package-macos.sh build-mac out "${{ inputs.version }}"
      - name: Bot run with the app (Apple silicon, and Intel through Rosetta)
        run: |
          mkdir elsewhere && cd elsewhere
          ditto -x -k ../out/Rolling-Rob-macOS.zip .
          for arch in arm64 x86_64; do
            if [ $arch = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "no Rosetta here: x86_64 not run"; continue; fi
            arch -$arch "Rolling Rob.app/Contents/MacOS/RollingRob" $BOT 2>&1 | tee bot-$arch.txt
            sh ../tools/check-bot-run.sh bot-$arch.txt
          done
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: out/Rolling-Rob-macOS.zip
          if-no-files-found: error
