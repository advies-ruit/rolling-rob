# Builds the web version on every push. A tag v* (e.g. v1.0) makes a GitHub
# release of it, with the desktop packages (packages.yml: Linux AppImage
# x86-64 and arm64, Windows x64, macOS universal), and publishes the site on
# GitHub Pages: the newest release at the top, every release in v/<tag>/
# (tools/assemble-site.sh), so players can go back to an older version and
# forward again. Running the workflow by hand publishes the site again from
# the existing releases.
# (Settings -> Pages -> Source: GitHub Actions.)
name: Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.10
      - name: Build
        run: tools/build-web.sh
        env:
          RR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Checksums and zip
        run: |
          cd build-web/web && sha256sum * | tee ../SHA256SUMS.txt
          cd .. && zip -qr Rolling-Rob-Web.zip web
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: web
          path: |
            build-web/Rolling-Rob-Web.zip
            build-web/SHA256SUMS.txt
          if-no-files-found: error

  packages:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}

  release:
    # the web build and every package, or nothing: a release is made only
    # when all of them were built and passed their bot run
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        run: |
          cd dist
          # SHA256SUMS.txt: the web build's files, then the downloads themselves
          sha256sum Rolling-Rob-* >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<NOTES
          Built from $GITHUB_SHA.

          - **Web**: plays at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ (Rolling-Rob-Web.zip is the site itself)
          - **Windows** (x64): unzip Rolling-Rob-Windows-x64.zip and start RollingRob.exe
          - **macOS** (Apple silicon and Intel, 11 or newer): unzip Rolling-Rob-macOS.zip; the app is not notarized, so macOS refuses it the first time: choose "Done", then System Settings -> Privacy & Security -> "Open Anyway" (or in Terminal: xattr -dr com.apple.quarantine "Rolling Rob.app")
          - **Linux** (x86-64) and **Raspberry Pi** (64-bit Raspberry Pi OS): Rolling-Rob-Linux-x86_64.AppImage or Rolling-Rob-Linux-aarch64.AppImage; make it executable (chmod +x) and start it
          - **Raspberry Pi with 32-bit Raspberry Pi OS** (Pi 2, 3, 4, 5, Zero 2): Rolling-Rob-Linux-armhf.AppImage; the Pi 1 and Zero (ARMv6) are not supported
          - The Linux AppImages need glibc 2.31 or newer: Debian 11+, Ubuntu 20.04+, Raspberry Pi OS 11 (Bullseye) and newer
          - **Linux without FUSE**, or a device with only a framebuffer (/dev/fb0): Rolling-Rob-Linux-<arch>.tar.gz, the same program; unpack it and start Rolling-Rob/rolling-rob
          NOTES
          gh release create "$GITHUB_REF_NAME" Rolling-Rob-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  site:
    needs: [build, release]
    # a tag: once its release is there; by hand: from the releases as they are
    if: >-
      always() && needs.build.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site from the releases
        run: tools/assemble-site.sh site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
